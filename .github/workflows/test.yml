name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: second_brain
          POSTGRES_PASSWORD: second_brain
          POSTGRES_DB: second_brain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U second_brain -d second_brain_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://second_brain:second_brain@localhost:5432/second_brain_test
      MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://second_brain:second_brain@localhost:5432/second_brain_migration_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Create migration test database
        run: >-
          PGPASSWORD=second_brain psql -h localhost -U second_brain -d postgres
          -c "CREATE DATABASE second_brain_migration_test"

      - name: Check lockfile
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest
